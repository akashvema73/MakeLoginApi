<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Nexus Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth">
    <div class="auth-brand">
      <div class="logo"><div class="logo-mark">N</div> Nexus Admin</div>
      <div>
        <h1>Manage your users,<br>all in one place.</h1>
        <p>Create accounts, control access and keep track of your team with a simple, secure admin console.</p>
      </div>
      <small>&copy; 2026 Nexus Admin. All rights reserved.</small>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-card">
        <h2>Welcome back</h2>
        <p class="sub">Sign in to your account to continue</p>
        <form id="loginForm" novalidate>
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
          <div class="field-error" id="emailError"></div>
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
          <div class="field-error" id="passwordError"></div>
          <button type="submit" class="btn block" id="submitBtn">Sign in</button>
        </form>
        <div class="alert" id="msg" hidden></div>
        <p class="switch">Don't have an account? <a href="register.html">Create one</a></p>

      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
