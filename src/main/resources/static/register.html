<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Nexus Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth">
    <div class="auth-brand">
      <div class="logo"><div class="logo-mark">N</div> Nexus Admin</div>
      <div>
        <h1>Get started in<br>under a minute.</h1>
        <p>Create your account and start managing users with role based access and a clean dashboard.</p>
      </div>
      <small>&copy; 2026 Nexus Admin. All rights reserved.</small>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-card">
        <h2>Create your account</h2>
        <p class="sub">Fill in the details below to register</p>
        <form id="registerForm" novalidate>
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Akash Verma" autocomplete="name">
          <div class="field-error" id="nameError"></div>
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@company.com" autocomplete="email">
          <div class="field-error" id="emailError"></div>
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">
          <div class="field-error" id="passwordError"></div>
          <button type="submit" class="btn block" id="submitBtn">Create account</button>
        </form>
        <div class="alert" id="msg" hidden></div>
        <p class="switch">Already have an account? <a href="index.html">Sign in</a></p>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
