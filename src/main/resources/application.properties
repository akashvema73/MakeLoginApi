spring.application.name=MakeLoginApi
server.port=8080

# MySQL: database apne aap ban jayega (bas MySQL chalu hona chahiye)
spring.datasource.url=jdbc:mysql://localhost:3306/user_management_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
# Table apne aap ban/update ho jayegi
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
